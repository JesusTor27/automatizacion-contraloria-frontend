
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Iniciar sesión | Contraloría de Sucre</title>

  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js" defer></script>
</head>

<body class="pagina-login">

  <main class="login-contenedor">

    <div class="login-encabezado">
      <h1>Contraloría de Sucre</h1>
      <p>Sistema de gestión de publicaciones</p>
    </div>

    <form id="form-login" class="login-formulario">

      <h2>Iniciar sesión</h2>

      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        placeholder="correo@institucion.gov.co"
        autocomplete="username"
        required
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="btn-login">
        Ingresar
      </button>

      <p id="mensaje-login" role="status"></p>

    </form>

  </main>

  <script>
    document.getElementById("form-login")
      .addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const boton = document.getElementById("btn-login");
        const mensaje = document.getElementById("mensaje-login");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        boton.disabled = true;
        mensaje.textContent = "Verificando credenciales...";

        try {
          await iniciarSesion(email, password);
          window.location.replace("/index.html");

        } catch (error) {
          mensaje.textContent =
            "No fue posible iniciar sesión. Verifica tus credenciales.";
          console.error(error);

        } finally {
          boton.disabled = false;
        }
      });
  </script>

</body>
</html>
